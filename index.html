    --cn-theme-muted-text: #acbdb2;
    --cn-theme-border: #3e4c43;
    --cn-theme-accent: #b4dec5;

    --cn-theme-card-shadow: #0003;
    --cn-theme-checkbox: #ecd395;
    --cn-theme-delete: #ffc4b6;
    --cn-theme-plain-shade: #c0bdab0d;
    --cn-theme-fiber-light: #ffffff09;
    --cn-theme-fiber-shade: #0002;
    --cn-theme-kraft: #5e432e;
    --cn-theme-kraft-light: #ffffff0b;
    --cn-theme-kraft-shade: #0003;
    --cn-theme-kraft-border: #a9825b72;
    --cn-theme-kraft-text: #f1d8be;

body {
  margin: 0 auto;
  max-width: 1440px;
  padding: 20px;
  background: var(--cn-theme-page);
}

@media (max-width: 600px) {
  body {
    padding: 0;
  }
}

#chigiri-notes{--cn-bg:var(--cn-theme-workspace);--cn-paper:var(--cn-theme-paper);--cn-ink:var(--cn-theme-text);--cn-soft:var(--cn-theme-muted-text);--cn-line:var(--cn-theme-border);--cn-accent:var(--cn-theme-accent);--cn-on:var(--cn-theme-accent-text);--cn-tint:var(--cn-theme-tint);color:var(--cn-ink);font-family:"Yu Gothic UI","Hiragino Sans",sans-serif;font-size:16px;line-height:1.6;background:var(--cn-bg);border:1px solid var(--cn-line);border-radius:18px;overflow:hidden}

oft);font-size:14px}#chigiri-notes .cn-row{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--cn-line);padding:var(--cn-rowpad,14px) 0}#chigiri-notes .cn-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--cn-accent);border-radius:50%;cursor:pointer}#chigiri-notes .cn-row input[type=text]{width:100%;min-width:0;border:0;background:transparent;padding:5px 0}#chigiri-notes .cn-linked{display:flex;align-items:center;gap:4px;color:var(--cn-soft);font-size:12px;white-space:nowrap}#chigiri-notes .cn-add{border:0;background:transparent;color:var(--cn-soft);display:flex;align-items:center;gap:8px;padding:16px 0 0}#chigiri-notes .cn-tearbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:0 30px 26px}#chigiri-notes .cn-selection{display:flex;gap:8px;align-items:center;font-size:14px;margin-right:auto}#chigiri-notes .cn-linkchoice{display:flex;align-items:center;gap:8px;font-size:14px}#chigiri-notes .cn-linkchoice input{width:17px;height:17px;accent-color:var(--cn-accent)}#chigiri-notes .cn-primary{background:var(--cn-accent);color:var(--cn-on);border:0;border-radius:9px;padding:11px 18px}#chigiri-notes .cn-boardhead{padding:0 30px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}#chigiri-notes #cn-canvas{position:relative;margin:0 20px 20px;min-height:455px;background-image:radial-gradient(var(--cn-line) 1px,transparent 1px);background-size:20px 20px}#chigiri-notes .cn-scrap{position:absolute;width:min(258px,calc(100% - 24px));padding:0 18px 20px;background:var(--cn-paper);border:1px solid var(--cn-line);box-shadow:0 7px 14px var(--cn-theme-card-shadow);border-radius:3px}#chigiri-notes .cn-grip{background:transparent;border:0;border-bottom:1px dashed var(--cn-line);width:100%;padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--cn-soft);font-size:12px;cursor:grab;touch-action:none}#chigiri-notes .cn-grip:active{cursor:grabbing}#chigiri-notes .cn-scrap textarea{margin:14px 0 12px;width:100%;height:105px;resize:vertical;max-height:180px;border:0;background:transparent;padding:0;font-size:17px;line-height:1.7}#chigiri-notes .cn-cardtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#chigiri-notes .cn-cardtools button{background:transparent;border:0;padding:4px 0;font-size:12px;color:var(--cn-soft)}#chigiri-notes .cn-cardtools button:last-child{margin-left:auto}#chigiri-notes .cn-cardtools label{display:flex;gap:5px;align-items:center;font-size:12px}#chigiri-notes .cn-cardtools input{accent-color:var(--cn-accent)}#chigiri-notes .cn-footer{border-top:1px solid var(--cn-line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 30px;font-size:13px;color:var(--cn-soft)}#chigiri-notes .cn-footer button{border:0;background:transparent;white-space:nowrap;padding:6px 0}#chigiri-notes .cn-empty{padding:80px 16px;text-align:center;color:var(--cn-soft)}

#chigiri-notes .cn-header{padding:12px 24px}
#chigiri-notes .cn-mark{font-size:29px}
#chigiri-notes .cn-workspace{display:grid;grid-template-columns:minmax(200px,23%) minmax(0,1fr)}
#chigiri-notes .cn-library{border-inline-end:1px solid var(--cn-line);padding:17px 12px;background:var(--cn-bg)}
#chigiri-notes .cn-library-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:10px}
#chigiri-notes .cn-library-head button,#chigiri-notes .cn-tools button{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:13px}
#chigiri-notes .cn-library-head svg,#chigiri-notes .cn-tools svg{width:16px;height:16px}
#chigiri-notes #cn-new{color:var(--cn-accent);background:var(--cn-paper)}
#chigiri-notes #cn-notebooks{display:grid;gap:5px}
#chigiri-notes .cn-notebook{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:10px}
#chigiri-notes .cn-notebook[aria-current=true]{background:var(--cn-tint);border-color:var(--cn-line)}
#chigiri-notes .cn-notebook span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chigiri-notes .cn-notebook span:first-child{font-size:14px;font-weight:600}
#chigiri-notes .cn-notebook span:last-child{font-size:12px;color:var(--cn-soft)}
#chigiri-notes .cn-title-field{position:relative;flex:1 1 190px;min-width:0;color:var(--cn-soft)}
#chigiri-notes .cn-title-field svg{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:15px;height:15px;pointer-events:none}
#chigiri-notes #cn-title{width:100%;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--cn-ink);padding:3px 26px 3px 0;font-size:25px;font-weight:600}
#chigiri-notes #cn-title:hover{border-color:var(--cn-line)}
#chigiri-notes .cn-boardhead{display:flex;justify-content:flex-start;align-items:center;gap:10px;padding-bottom:7px}
#chigiri-notes .cn-tools{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;border:1px solid var(--cn-line);background:var(--cn-paper)}
#chigiri-notes .cn-tools button[aria-pressed=true]{color:var(--cn-accent);background:var(--cn-tint)}
#chigiri-notes .cn-palettes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#chigiri-notes .cn-palette{display:flex;align-items:center;gap:6px;color:var(--cn-soft);font-size:13px}
#chigiri-notes .cn-palette select{font:inherit;color:var(--cn-ink);background:var(--cn-swatch,var(--cn-paper));border:1px solid var(--cn-line);border-radius:8px;padding:5px 6px;max-width:100%}
#chigiri-notes select:focus-visible{outline:3px solid var(--cn-accent);outline-offset:2px}
#chigiri-notes .cn-boardhint{color:var(--cn-soft);font-size:13px;margin:0 30px 10px;min-height:21px}
#chigiri-notes #cn-canvas{isolation:isolate;min-height:430px;overflow:hidden;border-radius:9px;border:1px solid var(--cn-line);background-color:var(--cn-board-color,var(--cn-bg));background-image:radial-gradient(var(--cn-theme-board-dot) 1px,transparent 1px)}
#chigiri-notes #cn-wires,#chigiri-notes #cn-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#chigiri-notes #cn-wires{z-index:0}
#chigiri-notes #cn-cards,#chigiri-notes #cn-ink-objects{position:absolute;inset:0;pointer-events:none}
#chigiri-notes .cn-free-mark{position:absolute;pointer-events:none}
#chigiri-notes #cn-ink{z-index:2000000000}
#chigiri-notes #cn-canvas:is([data-tool=pen],[data-tool=marker],[data-tool=erase],[data-tool=select]) #cn-ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#chigiri-notes #cn-canvas[data-tool=select] #cn-ink{cursor:default}
#chigiri-notes #cn-canvas[data-tool=select] #cn-ink[data-dragging]{cursor:grabbing}
#chigiri-notes .cn-scrap{width:min(var(--cn-card-width,236px),calc(100% - 20px));padding:0 13px 26px;pointer-events:auto;border-radius:6px;overflow:hidden;background:var(--cn-card-color,var(--cn-paper))}
#chigiri-notes .cn-paper-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#chigiri-notes .cn-cardtools{gap:6px}
#chigiri-notes .cn-cardtools .cn-palette{gap:3px;font-size:12px}
#chigiri-notes .cn-cardtools .cn-palette select{padding:2px 3px;font-size:12px}
#chigiri-notes .cn-list-shortcut{margin:0 0 14px}
#chigiri-notes .cn-columnlabels,#chigiri-notes .cn-row{display:grid;grid-template-columns:46px minmax(0,1fr) 51px;gap:9px;align-items:center}
#chigiri-notes .cn-columnlabels{font-size:12px;color:var(--cn-soft);padding:0 0 8px;border-bottom:1px solid var(--cn-line)}
#chigiri-notes .cn-columnlabels span:first-child,#chigiri-notes .cn-columnlabels span:last-child{text-align:center}
#chigiri-notes .cn-row{padding:var(--cn-rowpad,12px) 0}
#chigiri-notes .cn-rowmain{display:flex;align-items:center;min-width:0;gap:10px}
#chigiri-notes .cn-rowmain input{flex:1 1 auto}
#chigiri-notes .cn-rowcheck{display:grid;place-items:center;min-height:32px}
#chigiri-notes .cn-rowcheck input{margin:0}
#chigiri-notes .cn-row .cn-tearcheck input[type=checkbox]{accent-color:var(--cn-theme-checkbox)}
#chigiri-notes .cn-row[data-done] input[type=text],#chigiri-notes .cn-scrap[data-done] textarea{color:var(--cn-soft);text-decoration:line-through;text-decoration-thickness:1px}
#chigiri-notes .cn-scrap{transform:translate(-50%,-50%) rotate(var(--cn-paper-angle,0deg)) scale(var(--cn-paper-scale,1))}
#chigiri-notes .cn-scrap[data-done] .cn-grip span:last-child{color:var(--cn-accent);background:var(--cn-tint);border-radius:5px;padding:0 5px}
#chigiri-notes .cn-completed-divider{color:var(--cn-soft);font-size:12px;margin:18px 0 0;border-bottom:1px solid var(--cn-line);padding:0 0 6px}
#chigiri-notes .cn-delete-task{white-space:nowrap;min-width:max-content;border:0;background:none;color:var(--cn-soft);padding:3px 0;font-size:12px}
#chigiri-notes .cn-delete-task:hover{color:var(--cn-theme-delete);text-decoration:underline}
#chigiri-notes #cn-canvas[data-texture=plain] .cn-scrap{
  background-image:linear-gradient(145deg,transparent 22%,var(--cn-theme-plain-shade))
}
#chigiri-notes #cn-canvas[data-texture=fiber] .cn-scrap{
  background-image:var(--cn-grain),linear-gradient(113deg,var(--cn-theme-fiber-light),transparent 48%,var(--cn-theme-fiber-shade));background-repeat:repeat,no-repeat
}
#chigiri-notes #cn-canvas[data-texture=kraft] .cn-scrap{
  background-color:var(--cn-theme-kraft);
  background-image:var(--cn-kraft-grain),linear-gradient(116deg,var(--cn-theme-kraft-light),transparent 47%,var(--cn-theme-kraft-shade));
  background-repeat:repeat,no-repeat;border-color:var(--cn-theme-kraft-border)
}
#chigiri-notes #cn-canvas[data-texture=kraft] .cn-scrap .cn-grip,
#chigiri-notes #cn-canvas[data-texture=kraft] .cn-scrap .cn-cardtools button,
#chigiri-notes #cn-canvas[data-texture=kraft] .cn-scrap[data-done] textarea{color:var(--cn-theme-kraft-text)}
@media(max-width:600px){
 #chigiri-notes .cn-columnlabels,#chigiri-notes .cn-row{grid-template-columns:44px minmax(0,1fr) 44px;gap:5px}
 #chigiri-notes .cn-rowmain{flex-wrap:wrap;gap:0 9px}
 #chigiri-notes .cn-rowmain input{flex-basis:100%}
}

 #chigiri-notes .cn-header{padding:8px 16px}

#chigiri-notes .cn-decor-piece{
  position:absolute;border:0;background:none;padding:0;cursor:grab;touch-action:none;
  transform:translate(-50%,-50%) rotate(var(--cn-angle));display:grid;place-items:center;min-height:0
}
#chigiri-notes #cn-canvas[data-tool=move] .cn-decor-piece{pointer-events:auto}
#chigiri-notes .cn-decor-piece:active{cursor:grabbing}
#chigiri-notes .cn-decor-piece[data-attached]{cursor:pointer}
#chigiri-notes #cn-canvas[data-tool=move] .cn-scrap[data-pinned] .cn-grip{cursor:pointer}
#chigiri-notes .cn-scrap[data-pin-target]{outline:2px solid var(--cn-accent);outline-offset:3px}
#chigiri-notes .cn-pin-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
#chigiri-notes .cn-pin-actions select{font:inherit;border:1px solid var(--cn-line);border-radius:8px;padding:6px;max-width:min(150px,100%);color:var(--cn-ink);background:var(--cn-paper)}
#chigiri-notes .cn-decor-piece img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
#chigiri-notes .cn-inspector{display:flex;flex-wrap:wrap;align-items:center;gap:11px;padding:8px 12px;font-size:13px}
#chigiri-notes .cn-range{display:flex;align-items:center;gap:6px;color:var(--cn-soft);min-width:0}
#chigiri-notes .cn-range span{white-space:nowrap}
#chigiri-notes .cn-range input{max-width:110px;min-width:64px;accent-color:var(--cn-accent)}
#chigiri-notes .cn-inspector .cn-inspector-close{margin-inline-start:auto}
#chigiri-notes #cn-transform{
  position:absolute;z-index:1900000000;pointer-events:none;box-sizing:border-box;
  transform:translate(-50%,-50%) rotate(var(--cn-handle-angle,0deg));border:1.5px solid var(--cn-accent);
  box-shadow:0 0 0 1px var(--cn-paper);border-radius:3px
}
#chigiri-notes #cn-transform button{
  position:absolute;width:24px;height:24px;min-height:0;display:grid;place-items:center;
  pointer-events:auto;touch-action:none;padding:0;border:0;background:transparent;color:var(--cn-accent);
  transform:translate(-50%,-50%);border-radius:50%
}
#chigiri-notes #cn-transform button::before{
  content:"";grid-area:1 / 1;width:11px;height:11px;border:2px solid var(--cn-accent);border-radius:3px;
  background:var(--cn-paper);box-shadow:0 0 0 1px var(--cn-paper)
}
#chigiri-notes #cn-transform [data-handle=nw]{left:0;top:0;cursor:nwse-resize}
#chigiri-notes #cn-transform [data-handle=ne]{left:100%;top:0;cursor:nesw-resize}
#chigiri-notes #cn-transform [data-handle=sw]{left:0;top:100%;cursor:nesw-resize}
#chigiri-notes #cn-transform [data-handle=se]{left:100%;top:100%;cursor:nwse-resize}
#chigiri-notes #cn-transform [data-handle=rotate]{
  left:50%;top:-30px;width:28px;height:28px;min-height:0;background:var(--cn-paper);
  border:1.5px solid var(--cn-accent);cursor:grab
}
#chigiri-notes #cn-transform [data-handle=rotate]::before{display:none}
#chigiri-notes #cn-transform [data-handle=rotate]::after{
  content:"";position:absolute;top:100%;left:50%;height:16px;border-left:1.5px solid var(--cn-accent);pointer-events:none
}
#chigiri-notes #cn-transform [data-handle=rotate] span{font-size:19px;line-height:1}
#chigiri-notes #cn-transform[data-rotator=bottom] [data-handle=rotate]{top:calc(100% + 30px)}
#chigiri-notes #cn-transform[data-rotator=bottom] [data-handle=rotate]::after{top:auto;bottom:100%}
@media(max-width:600px){
 #chigiri-notes #cn-asset-picker,#chigiri-notes .cn-inspector{margin-inline:10px}
 #chigiri-notes #cn-asset-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(pointer:coarse){
 #chigiri-notes .cn-decor-piece{min-height:0}
 #chigiri-notes .cn-range input{min-height:44px}
 #chigiri-notes #cn-transform button{width:44px;height:44px}
 #chigiri-notes #cn-transform [data-handle=rotate]{width:44px;height:44px;top:-46px}
 #chigiri-notes #cn-transform[data-rotator=bottom] [data-handle=rotate]{top:calc(100% + 46px)}
 #chigiri-notes #cn-transform [data-handle=rotate]::after{height:24px}
}
@supports (color: color-mix(in srgb, black, white)) {
  #chigiri-notes .cn-library {
    background: color-mix(in srgb, var(--cn-tint) 45%, var(--cn-bg));
  }
  #chigiri-notes #cn-canvas {
    background-image: radial-gradient(color-mix(in srgb, var(--cn-ink) 17%, transparent) 1px, transparent 1px);
  }
  #chigiri-notes #cn-canvas[data-texture=kraft] .cn-scrap {
    background-color: color-mix(in srgb, var(--cn-theme-kraft) 68%, var(--cn-card-color) 32%);
  }
}
  </style>
</head>
<body>
<div id="chigiri-notes" aria-label="ちぎりメモ">
  <header class="cn-header"><div class="cn-brand"><span class="cn-mark" aria-hidden="true">c.</span><h2>ちぎりメモ</h2></div></header>
  <div class="cn-workspace">
  <aside class="cn-library" aria-label="メモ一覧">
    <div class="cn-library-head"><button type="button" id="cn-library-toggle" aria-expanded="true" aria-controls="cn-notebooks"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h4"></path><path d="M2 10h4"></path><path d="M2 14h4"></path><path d="M2 18h4"></path><rect width="16" height="20" x="4" y="2" rx="2"></rect><path d="M16 2v20"></path></svg>メモ一覧</button><button type="button" id="cn-new"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>新規メモ</button></div>
    <div id="cn-notebooks" aria-label="メモを選ぶ"></div>
  </aside>
  <div class="cn-editor">
  <div class="cn-top"><label class="cn-title-field"><input type="text" id="cn-title" aria-label="メモのタイトル" placeholder="タイトルなし" maxlength="50"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></label><div class="cn-modes" role="tablist" aria-label="メモのモード"><button type="button" id="cn-list-tab" role="tab" aria-controls="cn-list" aria-selected="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg>書く</button><button type="button" id="cn-board-tab" role="tab" aria-controls="cn-board" aria-selected="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>ひろげる <span id="cn-count">2</span></button></div></div>
  <section id="cn-list" role="tabpanel" aria-labelledby="cn-list-tab">
    <div class="cn-page">
      <p class="cn-sub cn-list-shortcut">Enterで次の項目</p>
      <div class="cn-columnlabels" aria-hidden="true"><span>完了</span><span>メモ</span><span>ちぎる</span></div>
      <div id="cn-rows"></div>
      <button type="button" class="cn-add" id="cn-add"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>項目を追加</button>
    </div>
    <div class="cn-tearbar"><div class="cn-selection"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><path d="M8.12 8.12 12 12"></path><path d="M20 4 8.12 15.88"></path><circle cx="6" cy="18" r="3"></circle><path d="M14.8 14.8 20 20"></path></svg><span id="cn-selected">2件を選択中</span></div><label class="cn-linkchoice"><input type="checkbox" id="cn-link" checked>元のメモと連動</label><button type="button" class="cn-primary" id="cn-tear">選んだメモをちぎる</button></div>
  </section>
  <section id="cn-board" role="tabpanel" aria-labelledby="cn-board-tab" hidden>
    <div class="cn-boardhead">
      <div class="cn-tools" role="group" aria-label="ボードの道具">
        <button type="button" data-tool="move" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"></path><path d="m15 19-3 3-3-3"></path><path d="m19 9 3 3-3 3"></path><path d="M2 12h20"></path><path d="m5 9-3 3 3 3"></path><path d="m9 5 3-3 3 3"></path></svg>移動</button>
        <button type="button" data-tool="connect" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><line x1="8" x2="16" y1="12" y2="12"></line></svg>つなぐ</button>
        <button type="button" data-tool="pen" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 21h8"></path><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>ペン</button>
        <button type="button" data-tool="marker" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>マーカー</button>
        <button type="button" data-tool="select" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"></path></svg>描画を選ぶ</button>
        <button type="button" data-tool="erase" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"></path><path d="m5.082 11.09 8.828 8.828"></path></svg>消しゴム</button>
      </div>
      <div class="cn-palettes">
        <label class="cn-palette"><span>背景</span><select id="cn-background" aria-label="ボードの背景色"></select></label>
        <label class="cn-palette"><span>紙の質感</span><select id="cn-texture" aria-label="紙の質感"><option value="plain">標準の紙</option><option value="fiber">繊維のある紙</option><option value="kraft">クラフト紙</option><option value="smooth">なめらか</option></select></label>
        <label class="cn-palette" id="cn-ink-choice" hidden><span>インク</span><select id="cn-ink-color" aria-label="ペンの色"></select></label>
        <button type="button" class="cn-decor-toggle" id="cn-decor-toggle" aria-expanded="false" aria-controls="cn-asset-picker"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 9a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z"></path><path d="M15 3v5a1 1 0 0 0 1 1h5"></path><path d="M8 13h.01"></path><path d="M16 13h.01"></path><path d="M10 16s.8 1 2 1c1.3 0 2-1 2-1"></path></svg>デコ素材</button>
      </div>
    </div>
    <section id="cn-asset-picker" aria-label="デコ素材を選ぶ" hidden>
      <label class="cn-palette cn-series-picker"><span>シリーズ</span><select id="cn-asset-series" aria-label="素材のシリーズ">
        <option value="all">すべて</option><option value="blue">水色の植物</option><option value="sage">セージグリーン</option>
        <option value="night">ミニマルな夜空</option><option value="lavender">ラベンダーの紙もの</option><option value="pretty">星空の紙もの</option>
        <option value="existing">前回の素材</option>
      </select></label>
      <div class="cn-picker-head">
        <div class="cn-categories" role="group" aria-label="素材の種類">
          <button type="button" data-collection="tape" aria-pressed="true">固定用テープ</button>
          <button type="button" data-collection="paper" aria-pressed="false">紙もの</button>
          <button type="button" data-collection="motif" aria-pressed="false">モチーフ</button>
          <button type="button" data-collection="wash" aria-pressed="false">水彩</button>
        </div>
        <div class="cn-picker-pages" id="cn-picker-pages">
          <button type="button" id="cn-assets-prev" aria-label="前の素材ページ">前へ</button>
          <span id="cn-assets-page" aria-live="polite"></span>
          <button type="button" id="cn-assets-next" aria-label="次の素材ページ">次へ</button>
        </div>
      </div>
      <div id="cn-asset-grid"></div>
      <p class="cn-assets-credit" id="cn-tape-hint">テープをカードに重ねて離すと、その場に固定できます。</p>
      <div class="cn-sub cn-assets-credit" id="cn-assets-credit" hidden>水彩素材の元画像表記：AqwaColor</div>
    </section>
    <p class="cn-boardhint" id="cn-boardhint" aria-live="polite"></p>
    <div class="cn-inspector" id="cn-size-inspector" role="group" aria-label="カードのサイズと回転" hidden>
      <label class="cn-palette"><span>形</span><select id="cn-card-shape" aria-label="カードの形"><option value="standard">標準</option><option value="portrait">縦長</option><option value="landscape">横長</option><option value="custom" disabled>カスタム</option></select></label>
      <label class="cn-range"><span>幅 <output id="cn-card-width-value"></output></span><input id="cn-card-width" type="range" aria-label="カードの幅" min="175" max="440" step="1"></label>
      <label class="cn-range"><span>高さ <output id="cn-card-height-value"></output></span><input id="cn-card-height" type="range" aria-label="カードの高さ" min="160" max="420" step="1"></label>
      <label class="cn-range"><span>角度 <output id="cn-card-angle-value"></output></span><input id="cn-card-angle" type="range" aria-label="カードの回転角度" min="-180" max="180" step="1"></label>
      <button type="button" class="cn-inspector-close" id="cn-size-close" aria-label="カードのサイズ調整を閉じる">閉じる</button>
    </div>
    <div class="cn-inspector" id="cn-decor-inspector" role="group" aria-label="デコ素材の調整" hidden>
      <span id="cn-decor-name"></span>
      <label class="cn-range"><span>大きさ <output id="cn-decor-size-value"></output></span><input id="cn-decor-size" type="range" min="30" max="260" step="1" aria-label="素材の大きさ"></label>
      <label class="cn-range"><span>角度 <output id="cn-decor-angle-value"></output></span><input id="cn-decor-angle" type="range" min="-180" max="180" step="1" aria-label="素材の回転角度"></label>
      <span class="cn-pin-actions" id="cn-pin-actions" hidden>
        <select id="cn-pin-target" aria-label="固定するカード"><option value="">固定先を選ぶ</option></select>
        <button type="button" id="cn-pin-attach" disabled>固定する</button>
      </span>
      <button type="button" id="cn-unpin" hidden>固定を解除</button>
      <button type="button" id="cn-decor-remove">素材を外す</button>
      <button type="button" class="cn-inspector-close" id="cn-decor-close" aria-label="素材の調整を閉じる">閉じる</button>
    </div>
    <div id="cn-canvas" data-tool="move" aria-label="メモを自由に配置するボード">
      <canvas id="cn-wires" aria-hidden="true"></canvas><div id="cn-cards"></div><div id="cn-decorations" aria-label="貼った素材"></div><div id="cn-ink-objects" aria-hidden="true"></div><canvas id="cn-ink" role="img" aria-label="手書きのレイヤー"></canvas>
      <div id="cn-transform" role="group" aria-label="選択したものの調整ハンドル" hidden>
        <button type="button" data-handle="nw" aria-label="左上の角でサイズ変更" data-tooltip="サイズ変更"></button>
        <button type="button" data-handle="ne" aria-label="右上の角でサイズ変更" data-tooltip="サイズ変更"></button>
        <button type="button" data-handle="sw" aria-label="左下の角でサイズ変更" data-tooltip="サイズ変更"></button>
        <button type="button" data-handle="se" aria-label="右下の角でサイズ変更" data-tooltip="サイズ変更"></button>
        <button type="button" data-handle="rotate" aria-label="回転ハンドル" data-tooltip="回転"><span aria-hidden="true">↻</span></button>
      </div>
    </div>
  </section>
  <footer class="cn-footer"><span id="cn-status" role="status" aria-live="polite"></span><button type="button" id="cn-undo" disabled>元に戻す</button></footer>
  </div>
  </div>

<script>
'use strict';

(() => {
  const root = document.getElementById('chigiri-notes');
  const query = selector => root.querySelector(selector);
  const rows = query('#cn-rows');
  const board = query('#cn-canvas');
  const cards = query('#cn-cards');
  const ink = query('#cn-ink');
  const wires = query('#cn-wires');
  const title = query('#cn-title');
  const library = query('#cn-notebooks');
  const color = query('#cn-ink-color');
  const background = query('#cn-background');
  const texture = query('#cn-texture');
  const toolButtons = [...root.querySelectorAll('[data-tool]')].filter(element => element.tagName === 'BUTTON');
  const clone = object => JSON.parse(JSON.stringify(object));
  const uid = () => 'n' + Math.random().toString(36).slice(2, 11);
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const colors = [
    ['#285c49', '#a8dbc1'], ['#285993', '#a9caff'], ['#a13f32', '#ffa898']
  ];
  const markerColors = [
    ['#f6ca36', '#f7ce4e'], ['#5bd89b', '#67e4a6'], ['#f58fb4', '#fb9abf']
  ];
  const boardColors = [
    ['標準', 'var(--cn-bg)'], ['砂色', 'var(--cn-theme-board-sand)'],
    ['ミント', 'var(--cn-theme-board-mint)'], ['空色', 'var(--cn-theme-board-sky)'],
    ['藤色', 'var(--cn-theme-board-lavender)']
  ];
  const paperColors = [
    ['白', 'var(--cn-paper)'], ['黄', 'var(--cn-theme-card-yellow)'],
    ['桃', 'var(--cn-theme-card-pink)'], ['緑', 'var(--cn-theme-card-green)'],
    ['青', 'var(--cn-theme-card-blue)'], ['紫', 'var(--cn-theme-card-purple)']
  ];
  const penLabels = ['深緑','青','朱色'];
  const markerLabels = ['黄色','ミント','ピンク'];
  const storageKey = 'chigiri-notes.workspace.v1:' + new URL('.', location.href).pathname;

  function createNote(id, name) {
    return {id, title:name, mode:'list', link:true, selected:[], notes:[], cards:[], edges:[], strokes:[], decorations:[]};
  }

  const sample = createNote('weekend', '週末の小さな計画');
  sample.notes = [
    {id:'n1', text:'朝はパン屋さんに寄り道する'},
    {id:'n2', text:'読みかけの本を持っていく'},
    {id:'n3', text:'川沿いで、のんびりコーヒー'},
    {id:'n4', text:'気になるお店を地図にまとめる'},
    {id:'n5', text:'パン屋さんの営業時間を調べる', done:true}
  ];
  sample.selected = ['n3','n4'];
  sample.cards = [
    {id:'c1', source:'n1', linked:true, text:sample.notes[0].text, x:.05, y:24},
    {id:'c2', source:'n2', linked:true, text:sample.notes[1].text, x:.94, y:220}
  ];
  const ideas = createNote('ideas', '思いついたこと');
  ideas.notes = [{id:'i1', text:'気になった本をここに書く'}];
  const defaults = {active:sample.id, notebooks:[sample, ideas]};

  function restoreNotebook(note) {
    delete note.hideDone;
    if (note.texture === 'torn') note.texture = 'plain';
    note.strokes = (note.strokes || []).map(mark =>
      Array.isArray(mark) ? {id:uid(),color:mark[0],path:mark[1]} : mark);
    return note;
  }

  function loadWorkspace() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved?.notebooks) && saved.notebooks.some(note => note.id === saved.active)) {
        saved.notebooks.forEach(restoreNotebook);
        return saved;
      }
    } catch {
      // Start with examples if browser storage is unavailable or unreadable.
    }
    return clone(defaults);
  }

  const workspace = loadWorkspace();
  const current = () => workspace.notebooks.find(note => note.id === workspace.active);
  const undo = new Map();
  const hints = {
    move:'カードの余白や素材を押すと調整枠が出ます。ドラッグで移動できます。',
    connect:'線で結びたいカードを2枚選びます。同じ組み合わせを選ぶと線を外せます。',
    pen:'カードの上から描くとカードに付き、余白から描くと独立します。',
    marker:'半透明のインクで、文字の上にも線を引けます。',
    select:'余白に描いた線を押して選び、そのままドラッグします。',
    erase:'手書きの線をなぞると、一筆ずつ消せます。'
  };
  let tool = 'move';
  let firstCard = null;
  let stroke = null;
  let selectedInk = null;
  let inkDrag = null;
  const activeShades = {pen:0, marker:0};
  let drag = null;
  let saveTimer = null;
  let libraryOverride;

  function element(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  }

  function status(message) {
    query('#cn-status').textContent = message;
  }

  function fillOptions(select, names, value) {
    select.replaceChildren(...names.map((name,index) => new Option(name,String(index))));
    select.value = String(value ?? 0);
  }

  function applyBackground() {
    const shade = current().background ?? 0;
    const swatch = boardColors[shade][1];
    background.value = String(shade);
    background.style.setProperty('--cn-swatch',swatch);
    board.style.setProperty('--cn-board-color',swatch);
  }

  function seededRandom(seed) {
    return () => {
      seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function paperGrain(isKraft) {
    const tile = document.createElement('canvas');
    tile.width = 128;
    tile.height = 128;
    const context = tile.getContext('2d');
    const random = seededRandom(isKraft ? 39647 : 63493);
    const image = context.createImageData(tile.width,tile.height);
    for (let i = 0; i < image.data.length; i += 4) {
      const shade = random() < .43 ? 52 : 255;
      image.data[i] = image.data[i+1] = image.data[i+2] = shade;
      image.data[i+3] = Math.round(random()*(isKraft ? 31 : 15));
    }
    context.putImageData(image,0,0);
    const fiberCount = isKraft ? 320 : 185;
    for (let i = 0; i < fiberCount; i++) {
      const x = random()*tile.width;
      const y = random()*tile.height;
      const length = 1.2 + random()*(isKraft ? 7.6 : 4.2);
      context.strokeStyle = i%3 ? (isKraft ? 'rgb(78 42 16 / 0.24)' : 'rgb(92 67 36 / 0.11)') : 'rgb(255 255 255 / 0.36)';
      context.lineWidth = .35 + random()*.48;
      context.beginPath();
      context.moveTo(x,y);
      context.quadraticCurveTo(x+length/2,y-1,x+length,y+(random()-.5)*3);
      context.stroke();
    }
    return 'url("' + tile.toDataURL() + '")';
  }

  function applyTexture() {
    const finish = current().texture ?? 'plain';
    if (finish === 'fiber' || finish === 'kraft') {
      const grain = finish === 'kraft' ? '--cn-kraft-grain' : '--cn-grain';
      if (!root.style.getPropertyValue(grain)) {
        root.style.setProperty(grain,paperGrain(finish === 'kraft'));
      }
    }
    texture.value = finish;
    board.dataset.texture = finish;
    layout();
  }

  texture.onchange = () => {
    backup();
    current().texture = texture.value;
    applyTexture();
    persist();
  };

  fillOptions(background,boardColors.map(([name]) => name),0);
  background.onchange = () => {
    backup();
    current().background = Number(background.value);
    applyBackground();
    persist();
  };

  function persist(delayed = false) {
    clearTimeout(saveTimer);
    if (delayed) {
      saveTimer = setTimeout(persist, 300);
      return;
    }
    saveTimer = null;
    try {
      localStorage.setItem(storageKey, JSON.stringify(workspace));
    } catch {
      status('変更を保存できませんでした。この画面では引き続き編集できます。');
    }
  }

  function backup(snapshot = clone(current())) {
    undo.set(snapshot.id, snapshot);
    query('#cn-undo').disabled = false;
  }

  function recordEditing(input, apply) {
    let started = false;
    input.addEventListener('focus', () => { started = false; });
    input.addEventListener('input', () => {
      if (!started) backup();
      started = true;
      apply(input.value);
      persist(true);
    });
  }

  function renderLibrary() {
    library.replaceChildren();
    for (const note of workspace.notebooks) {
      const button = element('button', 'cn-notebook');
      button.type = 'button';
      button.dataset.noteId = note.id;
      if (note.id === workspace.active) button.setAttribute('aria-current', 'true');
      button.append(element('span', '', note.title.trim() || 'タイトルなし'),
        element('span', '', previewText(note)));
      button.onclick = () => {
        if (workspace.active !== note.id) {
          workspace.active = note.id;
          setTool('move');
          render();
          status('');
          persist();
        }
        if (compact.matches) {
          libraryOverride = false;
          renderLibraryVisibility();
          query('#cn-library-toggle').focus();
        } else {
          library.querySelector('[aria-current]').focus();
        }
      };
      library.append(button);
    }
    query('#cn-new').disabled = workspace.notebooks.length >= 8;
  }

  const compact = matchMedia('(max-width: 720px)');
  function renderLibraryVisibility() {
    const show = libraryOverride ?? !compact.matches;
    library.hidden = !show;
    query('#cn-library-toggle').setAttribute('aria-expanded', String(show));
  }
  compact.addEventListener('change', () => {
    libraryOverride = undefined;
    renderLibraryVisibility();
  });
  query('#cn-library-toggle').onclick = () => {
    libraryOverride = library.hidden;
    renderLibraryVisibility();
  };
  query('#cn-new').onclick = () => {
    const note = createNote(uid(), 'タイトルなし');
    note.notes.push({id:uid(), text:''});
    workspace.notebooks.unshift(note);
    workspace.active = note.id;
    setTool('move');
    render();
    title.focus();
    title.select();
    status('タイトルを入力すると、メモ一覧に反映されます。');
    persist();
  };
  recordEditing(title, value => {
    current().title = value;
    const label = library.querySelector('[aria-current] span');
    if (label) label.textContent = value.trim() || 'タイトルなし';
  });
  title.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      if (current().mode === 'list') rows.querySelector('input[type=text]')?.focus();
      else title.blur();
    }
  });

  function setMode(mode) {
    current().mode = mode;
    query('#cn-list').hidden = mode !== 'list';
    query('#cn-board').hidden = mode !== 'board';
    if (mode === 'list') clearBoardSelection();
    for (const name of ['list','board']) {
      query('#cn-' + name + '-tab').setAttribute('aria-selected', String(name === mode));
    }
    if (mode === 'board') requestAnimationFrame(layout);
  }

  function updateCounts() {
    const note = current();
    query('#cn-count').textContent = note.cards.length;
    const selected = tearableItems(note).length;
    query('#cn-selected').textContent = selected ? selected + '件を選択中' : '項目を選んでちぎる';
    query('#cn-tear').disabled = !selected || note.cards.length >= 20;
    query('#cn-add').disabled = note.notes.length >= 20;
  }

  function tearableItems(note) {
    return note.notes.filter(item => note.selected.includes(item.id) && item.text.trim());
  }

  function previewText(note) {
    return note.notes.find(item => !item.done && item.text.trim())?.text ||
      note.notes.find(item => item.text.trim())?.text || '項目なし';
  }

  function updatePreview() {
    const preview = library.querySelector('[aria-current] span:last-child');
    if (preview) preview.textContent = previewText(current());
  }

  function updateText(source, text, activeInput) {
    const note = current();
    note.notes.find(item => item.id === source).text = text;
    for (const card of note.cards) {
      if (card.linked && card.source === source) card.text = text;
    }
    for (const input of root.querySelectorAll('[data-source]')) {
      if (input.dataset.source !== source || input === activeInput) continue;
      input.value = text;
      if (input.tagName==='TEXTAREA') fitPaperText(input);
    }
    updatePreview();
    updateCounts();
  }

  function renderRows() {
    const note = current();
    rows.replaceChildren();
    const pending = note.notes.filter(item => !item.done);
    const finished = note.notes.filter(item => item.done);
    const ordered = [...pending,...finished];
    ordered.forEach((item, index) => {
      if (item.done && index === pending.length) rows.append(element('div','cn-completed-divider','完了済み'));
      const row = element('div', 'cn-row');
      row.dataset.itemId = item.id;
      row.toggleAttribute('data-done',Boolean(item.done));
      const completed = element('input');
      completed.type = 'checkbox';
      completed.className = 'cn-done-check';
      completed.checked = Boolean(item.done);
      completed.setAttribute('aria-label','メモ' + (index+1) + 'の完了');
      completed.onchange = () => {
        backup();
        item.done = completed.checked;
        renderRows();
        renderCards();
        updatePreview();
        const checkbox = rows.querySelector('[data-item-id="' + item.id + '"] .cn-done-check');
        checkbox.focus();
        status(item.done ? '完了にしました。' : '未完了に戻しました。');
        persist();
      };
      const completionLabel = element('label','cn-rowcheck');
      completionLabel.append(completed);

      const check = element('input');
      check.type = 'checkbox';
      check.checked = note.selected.includes(item.id);
      check.setAttribute('aria-label', 'メモ' + (index+1) + 'を選択');
      check.onchange = () => {
        note.selected = check.checked ? [...note.selected,item.id] : note.selected.filter(id => id !== item.id);
        updateCounts();
        persist();
      };
      const tearLabel = element('label','cn-rowcheck cn-tearcheck');
      tearLabel.append(check);
      const input = element('input');
      input.type = 'text';
      input.value = item.text;
      input.placeholder = 'メモを書く';
      input.maxLength = 80;
      input.dataset.source = item.id;
      input.setAttribute('aria-label', 'メモ' + (index+1));
      recordEditing(input, value => updateText(item.id, value, input));
      input.onkeydown = event => {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          add(item.id);
        }
      };
      const content = element('div','cn-rowmain');
      content.append(input);
      if (note.cards.some(card => card.source === item.id && card.linked)) {
        content.append(element('span', 'cn-linked', '連動中'));
      }
      if (item.done) {
        const remove = element('button','cn-delete-task','削除');
        remove.type = 'button';
        remove.setAttribute('aria-label','完了したメモを削除: ' + (item.text.trim() || '空欄'));
        remove.onclick = () => deleteCompleted(item);
        content.append(remove);
      }
      row.append(completionLabel,content,tearLabel);
      rows.append(row);
    });
    updateCounts();
  }

  function deleteCompleted(item) {
    const note = current();
    backup();
    note.notes = note.notes.filter(entry => entry.id !== item.id);
    note.selected = note.selected.filter(id => id !== item.id);
    for (const card of note.cards.filter(entry => entry.source === item.id)) {
      if (card.linked) card.done = true;
      card.linked = false;
      delete card.source;
    }
    renderRows();
    renderCards();
    updatePreview();
    query('#cn-undo').focus();
    status('完了済みの項目を削除しました。');
    persist();
  }

  function add(after) {
    const note = current();
    if (note.notes.length >= 20) return;
    backup();
    const item = {id:uid(), text:''};
    const afterPending = after ? note.notes.findIndex(entry => entry.id === after && !entry.done) : -1;
    const index = afterPending >= 0 ? afterPending + 1 : note.notes.length;
    note.notes.splice(index,0,item);
    renderRows();
    rows.querySelector('[data-source="' + item.id + '"]').focus();
    persist();
  }

  function updateTool() {
    board.dataset.tool = tool;
    for (const button of toolButtons) button.setAttribute('aria-pressed', String(button.dataset.tool === tool));
    const inking = tool === 'pen' || tool === 'marker';
    query('#cn-ink-choice').hidden = !inking;
    if (inking) {
      color.setAttribute('aria-label',tool === 'marker' ? 'マーカーの色' : 'ペンの色');
      fillOptions(color, tool === 'marker' ? markerLabels : penLabels, activeShades[tool]);
    }
    query('#cn-boardhint').textContent = firstCard ? '次に、もう1枚のカードを選んでください。' : hints[tool];
    for (const grip of cards.querySelectorAll('.cn-grip')) {
      if (tool === 'connect') {
        grip.firstChild.hidden = false;
        grip.firstChild.textContent = 'このカードを選ぶ';
        grip.setAttribute('aria-label', 'つなぐカードを選択: ' + grip.dataset.caption);
        grip.setAttribute('aria-pressed', String(grip.closest('.cn-scrap').dataset.id === firstCard));
      } else {
        const pinned = isCardPinned(grip.closest('.cn-scrap').dataset.id);
        grip.firstChild.hidden = true;
        grip.firstChild.textContent = '';
        grip.setAttribute('aria-label', (pinned ? '固定中のカードのサイズ調整: ' : 'カードのサイズ調整と移動: ') + grip.dataset.caption);
        grip.removeAttribute('aria-pressed');
      }
    }
  }

  function setTool(next) {
    tool = next;
    firstCard = null;
    selectedInk = null;
    clearBoardSelection();
    updateTool();
    paint();
  }

  color.onchange = () => { activeShades[tool] = Number(color.value); };

  function connect(id) {
    if (!firstCard || firstCard === id) {
      firstCard = firstCard === id ? null : id;
      updateTool();
      return;
    }
    const note = current();
    const exists = note.edges.findIndex(pair => pair.includes(firstCard) && pair.includes(id));
    backup();
    if (exists >= 0) note.edges.splice(exists,1);
    else note.edges.push([firstCard,id]);
    firstCard = null;
    updateTool();
    paint();
    status(exists >= 0 ? 'カードをつなぐ線を外しました。' : 'カードを線でつなぎました。');
    persist();
  }

  function renderCards() {
    const note = current();
    cards.replaceChildren();
    if (!note.cards.length) {
      cards.append(element('div', 'cn-empty', '「書く」で項目をちぎると、ここにカードが並びます。'));
    }
    for (const card of note.cards) {
      const paper = element('article', 'cn-scrap');
      paper.dataset.id = card.id;
      applyCardDimensions(card,paper);
      paper.addEventListener('pointerdown',()=>touchBoardItem(card));
      paper.addEventListener('focusin',()=>touchBoardItem(card));
      const original = note.notes.find(item => item.id === card.source);
      const done = Boolean(card.linked ? original?.done : card.done);
      paper.toggleAttribute('data-done',done);
      const paperInk = element('canvas','cn-paper-ink');
      paperInk.setAttribute('aria-hidden','true');
      const grip = element('button', 'cn-grip');
      grip.type = 'button';
      grip.dataset.caption = card.text || '内容なし';
      grip.append(element('span'),
        element('span', '', done ? '完了' : card.linked ? '連動中' : '独立メモ'));
      grip.onclick = event => {
        const wasDragged = grip.hasAttribute('data-dragged');
        grip.removeAttribute('data-dragged');
        if (tool === 'connect') connect(card.id);
        else if (tool === 'move' && (!wasDragged || event.detail === 0)) selectCard(card.id);
      };
      attachMove(grip, paper, card);
      const writingArea = element('div','cn-paper-body');
      const text = element('textarea');
      text.value = card.text;
      text.rows = 1;
      text.maxLength = 80;
      text.placeholder = 'ここに書く';
      text.setAttribute('aria-label', 'カードの内容');
      if (card.linked) text.dataset.source = card.source;
      recordEditing(text, value => {
        card.text = value;
        fitPaperText(text);
        if (card.linked) updateText(card.source, value, text);
      });
      writingArea.append(text);
      const actions = element('div', 'cn-cardtools');
      const paperPicker = element('label','cn-palette');
      const paperColor = element('select');
      paperColor.setAttribute('aria-label','カードの紙色');
      fillOptions(paperColor,paperColors.map(([name]) => name),card.paper);
      const applyPaperColor = () => {
        const swatch = paperColors[card.paper ?? 0][1];
        paperColor.style.setProperty('--cn-swatch',swatch);
        paper.style.setProperty('--cn-card-color',swatch);
      };
      paperColor.onchange = () => {
        backup();
        card.paper = Number(paperColor.value);
        applyPaperColor();
        persist();
      };
      paperPicker.append(element('span','','色'),paperColor);
      applyPaperColor();
      const label = element('label');
      const toggle = element('input');
      toggle.type = 'checkbox';
      toggle.checked = card.linked;
      label.append(toggle, document.createTextNode('連動'));
      toggle.onchange = () => {
        backup();
        card.linked = toggle.checked;
        if (card.linked) card.text = original.text;
        else card.done = Boolean(original.done);
        renderRows();
        renderCards();
        cards.querySelector('[data-id="' + card.id + '"] input').focus();
        status(card.linked ? '元のメモの内容で連動を再開しました。' : 'このカードだけ編集できます。');
        persist();
      };
      const source = element('button', '', '元のメモ');
      source.type = 'button';
      source.onclick = () => {
        setMode('list');
        rows.querySelector('[data-source="' + card.source + '"]')?.focus();
        status('カードの元のメモを開きました。');
        persist();
      };
      const remove = element('button', '', '外す');
      remove.type = 'button';
      remove.onclick = () => {
        backup();
        (note.decorations || []).filter(piece=>piece.pin?.card===card.id).forEach(detachTape);
        note.cards = note.cards.filter(entry => entry.id !== card.id);
        note.edges = note.edges.filter(pair => !pair.includes(card.id));
        note.strokes = note.strokes.filter(mark => mark.card !== card.id);
        if (firstCard === card.id) firstCard = null;
        renderRows();
        renderCards();
        renderDecorations();
        query('#cn-undo').focus();
        status('カードをボードから外しました。');
        persist();
      };
      if (original) actions.append(label);
      actions.append(paperPicker);
      if (original) actions.append(source);
      actions.append(remove);
      paper.append(grip, writingArea, actions, paperInk);
      cards.append(paper);
    }
    updateTool();
    updateInspectors();
    layout();
  }

  const paperTextFit = new WeakMap();
  function fitPaperText(field) {
    const body = field.parentElement;
    if (!body?.clientWidth) return;
    const key = body.clientWidth+'|'+body.clientHeight+'|'+field.value;
    if (paperTextFit.get(field)===key) return;
    paperTextFit.set(field,key);
    const oneLine = Math.ceil(parseFloat(getComputedStyle(field).lineHeight) || 27);
    field.style.height = oneLine+'px';
    field.style.height = Math.min(body.clientHeight,Math.max(oneLine,field.scrollHeight))+'px';
  }

  function attachMove(grip, paper, card) {
    paper.onpointerdown = event => {
      if (tool !== 'move' || event.button !== 0 || drag) return;
      const onGrip = grip.contains(event.target);
      if (!onGrip && event.target.closest('button,textarea,input,select,label,a')) return;
      grip.removeAttribute('data-dragged');
      const locked = isCardPinned(card.id);
      if (onGrip && locked) {
        status('テープで固定中です。動かすにはテープの固定を解除してください。');
        return;
      }
      if (!onGrip) {
        event.preventDefault();
        const active = document.activeElement;
        if (root.contains(active) && active.matches('textarea,input[type=text]')) active.blur();
      }
      drag = {paper,onGrip,locked,id:event.pointerId,startX:event.clientX,startY:event.clientY,x:card.x,y:card.y,moved:false};
      (onGrip ? grip : paper).setPointerCapture(event.pointerId);
    };
    paper.onpointermove = event => {
      if (drag?.id !== event.pointerId || drag.paper!==paper) return;
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      if (!drag.moved && Math.hypot(dx,dy) < 3) return;
      if (drag.locked) {
        if (!drag.moved) status('テープで固定中です。動かすにはテープの固定を解除してください。');
        drag.moved = true;
        return;
      }
      if (!drag.moved) backup();
      drag.moved = true;
      paper.setAttribute('data-moving','');
      const range = Math.max(1,board.clientWidth - (paperPoses.get(paper)?.w ?? paper.offsetWidth));
      card.x = clamp(drag.x + dx / range,0,1);
      card.y = clamp(drag.y + dy,0,3900);
      layout();
    };
    const end = event => {
      if (drag?.id !== event.pointerId || drag.paper!==paper) return;
      const {moved,onGrip,locked} = drag;
      drag = null;
      paper.removeAttribute('data-moving');
      if (moved && !locked) {
        if (onGrip) grip.setAttribute('data-dragged','');
        persist();
      }
      if (!onGrip && event.type==='pointerup') selectCard(card.id);
    };
    paper.onpointerup = end;
    paper.onpointercancel = end;
    paper.onlostpointercapture = end;
    grip.onkeydown = event => {
      const offset = {ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]}[event.key];
      if (!offset || tool !== 'move') return;
      event.preventDefault();
      if (isCardPinned(card.id)) {
        status('テープで固定中です。動かすにはテープの固定を解除してください。');
        return;
      }
      backup();
      setTopLayer(card);
      const range = Math.max(1,board.clientWidth - (paperPoses.get(paper)?.w ?? paper.offsetWidth));
      card.x = clamp(card.x + offset[0] / range,0,1);
      card.y = clamp(card.y + offset[1],0,3900);
      layout();
      persist();
    };
  }

  function layout() {
    const width = board.clientWidth;
    if (!width) return;
    let height = 430;
    const byId = new Map(current().cards.map(card => [card.id,card]));
    for (const paper of cards.querySelectorAll('.cn-scrap')) {
      const card = byId.get(paper.dataset.id);
      fitPaperText(paper.querySelector('textarea'));
      const pose = paperPose(paper,card,width);
      paperPoses.set(paper,pose);
      paper.style.zIndex = boardObjectLayer(card);
      paper.style.left = pose.x+'px';
      paper.style.top = pose.y+'px';
      paper.style.setProperty('--cn-paper-scale',pose.scale);
      paper.style.setProperty('--cn-paper-angle',pose.angle+'deg');
      height = Math.max(height,pose.y+pose.radiusY+24);
    }
    height = Math.max(height,layoutDecorations(width),layoutTransform(width));
    for (const {path, card, dy = 0} of current().strokes) {
      if (card) continue;
      for (let index = 2; index < path.length; index += 5) {
        height = Math.max(height,parseInt(path.slice(index,index+3),36) + dy + 16);
      }
    }
    board.style.height = height + 2 + 'px';
    paint();
  }

  function fitCanvas(canvas) {
    const scale = Math.min(devicePixelRatio || 1,2);
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const w = Math.round(width * scale);
    const h = Math.round(height * scale);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    const context = canvas.getContext('2d');
    context.setTransform(scale,0,0,scale,0,0);
    context.clearRect(0,0,width,height);
    context.lineJoin = 'round';
    context.lineCap = 'round';
    return context;
  }

  function decode(mark, width = board.clientWidth) {
    const points = [];
    const {path, card, dx = 0, dy = 0} = mark;
    for (let index = 0; index < path.length; index += 5) {
      const x = parseInt(path.slice(index,index+2),36);
      const y = parseInt(path.slice(index+2,index+5),36);
      points.push(card ? [(x-300)*width/600,y-300] : [(x+dx)*width/1000,y+dy]);
    }
    return points;
  }

  function drawMark(context, mark, width, dark, heightScale = 1) {
    const points = decode(mark,width);
    if (!points.length) return;
    const palette = mark.marker ? markerColors : colors;
    context.strokeStyle = (palette[mark.color] || palette[0])[dark ? 1 : 0];
    context.lineWidth = mark.marker ? 17 : 2.8;
    context.globalAlpha = mark.marker ? .44 : 1;
    context.beginPath();
    context.moveTo(points[0][0],points[0][1]*heightScale);
    for (const [x,y] of points.slice(1)) context.lineTo(x,y*heightScale);
    if (points.length === 1) context.lineTo(points[0][0] + .1,points[0][1]*heightScale);
    context.stroke();
    context.globalAlpha = 1;
  }

  function markBounds(mark) {
    const points = decode(mark);
    const x = points.map(point => point[0]);
    const y = points.map(point => point[1]);
    return [Math.min(...x),Math.min(...y),Math.max(...x),Math.max(...y)];
  }

  function paint() {
    if (!board.clientWidth) return;
    const geometry = new Map([...cards.querySelectorAll('.cn-scrap')].map(paper => [paper.dataset.id,paper]));
    const dark = getComputedStyle(root).colorScheme === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches;
    const wireContext = fitCanvas(wires);
    for (const [from,to] of current().edges) {
      const a = geometry.get(from);
      const b = geometry.get(to);
      if (!paperPoses.has(a) || !paperPoses.has(b)) continue;
      const {x:x1,y:y1} = paperPoses.get(a);
      const {x:x2,y:y2} = paperPoses.get(b);
      wireContext.beginPath();
      wireContext.moveTo(x1,y1);
      wireContext.bezierCurveTo(x1,(y1+y2)/2,x2,(y1+y2)/2,x2,y2);
      wireContext.strokeStyle = dark ? '#8ebeaa' : '#507e68';
      wireContext.lineWidth = 2.6;
      wireContext.stroke();
    }
    const layers = new Map();
    const paperCards = new Map(current().cards.map(card=>[card.id,card]));
    for (const [id,paper] of geometry) {
      const layer = paper.querySelector('.cn-paper-ink');
      layers.set(id,[fitCanvas(layer),layer.clientWidth,cardInkScale(layer,paperCards.get(id))]);
    }
    const inkContext = fitCanvas(ink);
    const marks = stroke?.mark.path ? [...current().strokes,stroke.mark] : current().strokes;
    paintFreeMarks(dark);
    for (const mark of marks) {
      if (!mark.card && mark===stroke?.mark) {
        drawMark(inkContext,mark,board.clientWidth,dark);
      } else if (layers.has(mark.card)) {
        const [context,width,heightScale] = layers.get(mark.card);
        drawMark(context,mark,width,dark,heightScale);
      }
    }
    const selected = marks.find(mark => mark.id === selectedInk);
    if (selected) {
      const [left,top,right,bottom] = markBounds(selected);
      inkContext.save();
      inkContext.strokeStyle = dark ? '#c5ead6' : '#236349';
      inkContext.lineWidth = 1.4;
      inkContext.setLineDash([5,4]);
      inkContext.strokeRect(left-10,top-10,right-left+20,bottom-top+20);
      inkContext.restore();
    }
  }

  function nearMark(point, mark, width) {
    const points = decode(mark,width);
    return points.some((end,index) => {
      const start = points[index-1] || end;
      const [dx,dy] = [end[0]-start[0],end[1]-start[1]];
      const length = dx*dx + dy*dy;
      const t = length ? clamp(((point[0]-start[0])*dx + (point[1]-start[1])*dy)/length,0,1) : 0;
      return Math.hypot(point[0]-start[0]-dx*t,point[1]-start[1]-dy*t) < (mark.marker ? 19 : 12);
    });
  }

  function cardAt(x,y) {
    return document.elementsFromPoint(x,y).find(element => element.classList.contains('cn-scrap'));
  }

  function canvasPosition(layer,x,y) {
    const pose = paperPoses.get(layer.parentElement);
    if (pose) {
      const bounds = ink.getBoundingClientRect();
      const local = turnPoint(x-bounds.left-pose.x,y-bounds.top-pose.y,-pose.angle);
      return [local[0]/pose.scale+layer.clientWidth/2,local[1]/pose.scale+layer.clientHeight/2];
    }
    const bounds = layer.getBoundingClientRect();
    return [(x-bounds.left)*layer.clientWidth/bounds.width,
      (y-bounds.top)*layer.clientHeight/bounds.height];
  }

  function eraseAt(x,y) {
    const note = current();
    const ordered = [...note.strokes].sort((a,b)=>boardObjectLayer(b)-boardObjectLayer(a));
    const boardPoint = canvasPosition(ink,x,y);
    let hit = ordered.find(mark => !mark.card && nearMark(boardPoint,mark));
    if (!hit) {
      const paper = cardAt(x,y);
      if (paper) {
        const layer = paper.querySelector('.cn-paper-ink');
        const card = note.cards.find(item=>item.id===paper.dataset.id);
        const [paperX,paperY] = canvasPosition(layer,x,y);
        const local = [paperX,paperY/cardInkScale(layer,card)];
        hit = ordered.find(mark => mark.card === paper.dataset.id && nearMark(local,mark,layer.clientWidth));
      }
    }
    if (hit) {
      if (!stroke.changed) backup();
      stroke.changed = true;
      note.strokes = note.strokes.filter(mark => mark !== hit);
    }
  }

  function sampleStroke(event) {
    const point = [event.clientX,event.clientY];
    const last = stroke.last || point;
    const distance = Math.hypot(point[0]-last[0],point[1]-last[1]);
    if (stroke.kind === 'erase') {
      const steps = Math.max(1,Math.ceil(distance/10));
      for (let i = 1; i <= steps; i++) {
        eraseAt(last[0]+(point[0]-last[0])*i/steps,last[1]+(point[1]-last[1])*i/steps);
      }
      stroke.last = point;
    } else if ((!stroke.last || distance >= 2) && stroke.mark.path.length < 3000) {
      const [localX,y] = canvasPosition(stroke.layer,...point);
      const x = localX/stroke.layer.clientWidth;
      const onCard = Boolean(stroke.mark.card);
      const encodedX = onCard ? clamp(x*600+300,0,1295) : clamp(x,0,1)*1000;
      const card = onCard ? current().cards.find(card=>card.id===stroke.mark.card) : null;
      const encodedY = onCard ? clamp(y/cardInkScale(stroke.layer,card)+300,0,1800) :
        clamp(y,0,Math.min(stroke.layer.clientHeight-1,4200));
      stroke.mark.path += Math.round(encodedX).toString(36).padStart(2,'0') +
        Math.round(encodedY).toString(36).padStart(3,'0');
      stroke.last = point;
    }
    paint();
  }

  function beginInkMove(event) {
    const bounds = ink.getBoundingClientRect();
    const point = [event.clientX-bounds.left,event.clientY-bounds.top];
    const free = current().strokes.filter(mark => !mark.card);
    let hit = free.sort((a,b)=>boardObjectLayer(b)-boardObjectLayer(a)).find(mark => nearMark(point,mark));
    const previous = free.find(mark => mark.id === selectedInk);
    if (!hit && previous) {
      const [left,top,right,bottom] = markBounds(previous);
      if (point[0] >= left-10 && point[0] <= right+10 && point[1] >= top-10 && point[1] <= bottom+10) hit = previous;
    }
    selectedInk = hit?.id || null;
    if (hit) {
      touchBoardItem(hit);
      inkDrag = {id:event.pointerId, mark:hit, startX:event.clientX, startY:event.clientY,
        dx:hit.dx || 0,dy:hit.dy || 0,bounds:markBounds(hit),moved:false};
      ink.setPointerCapture(event.pointerId);
    }
    paint();
  }

  function moveInk(event) {
    const dx = event.clientX-inkDrag.startX;
    const dy = event.clientY-inkDrag.startY;
    if (!inkDrag.moved && Math.hypot(dx,dy) < 3) return;
    if (!inkDrag.moved) backup();
    inkDrag.moved = true;
    ink.dataset.dragging = '';
    const [left,top,right,bottom] = inkDrag.bounds;
    const width = board.clientWidth;
    inkDrag.mark.dx = inkDrag.dx + Math.round(clamp(dx,-left,width-right)*1000/width);

    const paper = tool === 'erase' ? null : cardAt(event.clientX,event.clientY);
    const mark = {id:uid(),color:Number(color.value),path:''};

    stroke = {id:event.pointerId,kind:tool,mark,layer:paper?.querySelector('.cn-paper-ink') || ink,last:null,changed:false};

  function placeCard(note,item) {
    const space = query('.cn-editor').clientWidth - 44;
    const width = Math.min(236,space-20);
    const padding = window.matchMedia('(pointer: coarse)').matches ? 86 : 28;
    const gap = 190 + padding;
    const columns = space >= 490 ? [.04,.96,.5] : [.15];
    const occupied = note.cards.map(card => {
      const [wantedWidth,wantedHeight] = cardDimensions(card);
      const actualWidth = Math.min(wantedWidth,space-20);
      return {left:card.x*(space-actualWidth),width:actualWidth,top:card.y,height:wantedHeight+padding};
    });
    let desired;
    for (let y = 24; !desired && y < 4100; y += gap) {
      for (const x of columns) {
        const left = x*(space-width);
        if (occupied.every(area=>left+width+8<=area.left || left>=area.left+area.width+8 ||
            y+gap<=area.top || y>=area.top+area.height)) {
          desired = {x,y};
          break;
        }
      }
    }
    const card = {id:uid(),source:item.id,linked:note.link,text:item.text,...(desired || {x:.5,y:3900})};
    if (item.done && !note.link) card.done = true;
    note.cards.push(card);
    setTopLayer(card);
  }

  function simplifyVectorLine(points,from,to,tolerance) {
    const [ax,ay] = points[from];
    const dx = points[to][0]-ax;
    const dy = points[to][1]-ay;
    const distance = Math.hypot(dx,dy);
    if (!distance || to-from<2) return [points[from],points[to]];
    let largest = 0;
    let split = 0;
    for (let i=from+1;i<to;i++) {
      const cross = Math.abs(dx*(points[i][1]-ay)-dy*(points[i][0]-ax));
      if (cross>largest) {
        largest = cross;
        split = i;
      }
    }
    if (largest <= distance*tolerance) return [points[from],points[to]];
    const left = simplifyVectorLine(points,from,split,tolerance);
    const right = simplifyVectorLine(points,split,to,tolerance);
    left.pop();
    return left.concat(right);
  }

  function vectorCorners(points,tolerance) {
    const corners = points.filter(([x,y],i) => {
      const [ax,ay] = points[(i+points.length-1)%points.length];
      const [bx,by] = points[(i+1)%points.length];
      return (x-ax)*(by-y) !== (y-ay)*(bx-x);
    });
    if (corners.length <= 5 || !tolerance) return corners;
    const [ox,oy] = corners[0];
    let farthest = 0;
    let index = 1;
    for (let i=1;i<corners.length;i++) {
      const x = corners[i][0]-ox;
      const y = corners[i][1]-oy;
      const distance = x*x+y*y;
      if (distance>farthest) {
        farthest = distance;
        index = i;
      }
    }
    const first = simplifyVectorLine(corners,0,index,tolerance);
    const second = simplifyVectorLine([...corners,corners[0]],index,corners.length,tolerance);
    first.pop();
    second.pop();
    const result = first.concat(second);
    return result.length>=3 ? result : corners;
  }

  function outlines(edges,pitch,tolerance) {
    const paths = [];
    const coord = point => [point%pitch,Math.floor(point/pitch)];
    // The same edge order and corner reduction used for the source SVGs.
    function traceLoop(start) {
      const points = [coord(start)];
      let here = start;
      let previous;
      do {
        const ends = edges.get(here);
        let end;
        if (ends.length===1 || previous===undefined) {
          end = ends.pop();
        } else {
          const [x,y] = coord(here);
          const [px,py] = coord(previous);
          const right = x-y+py + (y+x-px)*pitch;
          const index = ends.indexOf(right);
          end = ends.splice(index===-1 ? 0 : index,1)[0];
        }
        if (!ends.length) edges.delete(here);
        if (end===start) break;
        points.push(coord(end));
        previous = here;
        here = end;
      } while (true);
      const polygonArea = Math.abs(points.reduce((sum,[x,y],i) => {
        const [px,py] = points[(i+points.length-1)%points.length];
        return sum+x*py-y*px;
      },0));
      if (polygonArea<2) return;
      const corners = vectorCorners(points,tolerance);
      if (corners.length>=3) paths.push('M'+corners.map(point=>point.join(' ')).join(' ')+'Z');
    }
    for (const start of edges.keys()) {
      while (edges.has(start)) traceLoop(start);
    }
    return paths.join('');
  }

  function collectVectorEdges(pixels,width,height,count) {
    const pitch = width+1;
    const edges = Array.from({length:count+1},()=>new Map());
    const sides = [
      [0,-1,0,1], [1,0,1,pitch], [0,1,pitch+1,-1], [-1,0,pitch,-pitch]
    ];
    for (const [nx,ny,vertex,step] of sides) {
      for (let y=0;y<height;y++) {
        for (let x=0;x<width;x++) {
          const group = pixels[y*width+x];
          if (!group) continue;
          const otherX = x+nx;
          const otherY = y+ny;
          if (otherX>=0 && otherX<width && otherY>=0 && otherY<height &&
              pixels[otherY*width+otherX]===group) continue;
          const start = y*pitch+x+vertex;
          const ends = edges[group].get(start);
          if (ends) ends.push(start+step);
          else edges[group].set(start,[start+step]);
        }
      }
    }
    return edges;
  }

  function baseVectorMask(pixels,width,height,colors) {
    const mask = new Uint8Array(pixels.length);
    const opaque = Uint8Array.from([0,...colors.map(color => Number(color[2]))]);
    for (let y=1;y<height-1;y++) {
      for (let x=1;x<width-1;x++) {
        const i = y*width+x;
        if (!opaque[pixels[i]]) continue;
        mask[i] = Number([
          i-width-1,i-width,i-width+1,i-1,i+1,i+width-1,i+width,i+width+1
        ].every(index=>opaque[pixels[index]]));
      }
    }
    return mask;
  }

  async function decodeVector(asset) {
    const {width,height,base,colors,compressed,category} = asset;
    const bytes = Uint8Array.from(atob(compressed), char => char.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const pixels = new Uint8Array(await new Response(stream).arrayBuffer());
    const paths = [];
    if (base) {
      const solid = baseVectorMask(pixels,width,height,colors);
      const [,edges] = collectVectorEdges(solid,width,height,1);
      const path = outlines(edges,width+1,.35);
      if (path) paths.push('<path fill="'+base+'" d="'+path+'"/>');
    }
    const edges = collectVectorEdges(pixels,width,height,colors.length);
    colors.forEach(([color,opacity],i)=>{
      const path = outlines(edges[i+1],width+1,category ? 0 : .36);
      const alpha = opacity<.998 ? ' fill-opacity="'+opacity.toFixed(3)+'"' : '';
      if (path) paths.push('<path fill="'+color+'"'+alpha+' d="'+path+'"/>');
    });
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+
      '" viewBox="0 0 '+width+' '+height+'"><g fill-rule="evenodd" shape-rendering="crispEdges">'+
      paths.join('')+'</g></svg>';
    return URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  }

  function loadVector(asset,image) {

      image.alt = asset.name + '（表示できませんでした）';

  }

  function boardObjectLayer(item) {
    if (Number.isInteger(item.layer)) return item.layer;
    const note = current();
    const cardIndex = note.cards.indexOf(item);
    if (cardIndex>=0) return 2+cardIndex*2;
    const decorIndex = (note.decorations || []).indexOf(item);
    if (decorIndex>=0) return 52+decorIndex*2;
    return 128+Math.max(0,note.strokes.indexOf(item))*2;
  }

  function topBoardLayer() {
    const note = current();
    const objects = [...note.cards,...(note.decorations || []).filter(piece=>!piece.pin),
      ...note.strokes.filter(mark=>!mark.card)];
    return Math.max(0,...objects.map(boardObjectLayer));
  }

  function setTopLayer(item) {
    const top = topBoardLayer();
    if (boardObjectLayer(item)>=top) return false;
    item.layer = top+2;

  function paintFreeMarks(dark) {
    const free = current().strokes.filter(mark=>!mark.card);
    const alive = new Set(free.map(mark=>mark.id));
    for (const [id,entry] of markCanvases) {
      if (!alive.has(id)) {
        entry.canvas.remove();
        markCanvases.delete(id);
      }
    }
    for (const mark of free) {
      let entry = markCanvases.get(mark.id);
      if (!entry) {
        const canvas = element('canvas','cn-free-mark');
        canvas.dataset.id = mark.id;
        markLayer.append(canvas);
        entry = {canvas,key:''};
        markCanvases.set(mark.id,entry);
      }
      const {canvas} = entry;
      canvas.style.zIndex = boardObjectLayer(mark);
      const [left,top,right,bottom] = markBounds(mark);
      const pad = mark.marker ? 10 : 3;
      const x = Math.floor(left-pad);
      const y = Math.floor(top-pad);
      const width = Math.ceil(right+pad)-x;
      const height = Math.ceil(bottom+pad)-y;
      const key = [board.clientWidth,x,y,width,height,dark,devicePixelRatio,mark.dx,mark.dy,mark.color,Boolean(mark.marker),mark.path].join('|');
      if (key===entry.key) continue;
      entry.key = key;
      canvas.style.left = x+'px';
      canvas.style.top = y+'px';
      canvas.style.width = width+'px';
      canvas.style.height = height+'px';
      const context = fitCanvas(canvas);
      context.translate(-x,-y);
      drawMark(context,mark,board.clientWidth,dark);
    }
  }

  function cardDimensions(card) {

  function writingSpace(card) {

  function cardInkScale(layer,card) {

  function renderAssetPicker() {
    const inSeries = activeSeries==='all' ? vectorAssets : vectorAssets.filter(asset=>asset.series===activeSeries);
    const roles = new Set(inSeries.map(assetCollection));
    if (!roles.has(activeCollection)) {
      activeCollection = ['paper','motif','wash','tape'].find(role=>roles.has(role));
      activeAssetPage = 0;
    }
    const available = inSeries.filter(asset=>assetCollection(asset)===activeCollection);
    const pages = Math.ceil(available.length/assetsPerPage);
    activeAssetPage = clamp(activeAssetPage,0,pages-1);
    const start = activeAssetPage*assetsPerPage;
    query('#cn-assets-page').textContent = (activeAssetPage+1)+' / '+pages;
    query('#cn-picker-pages').hidden = pages<2;
    query('#cn-assets-prev').disabled = activeAssetPage===0;
    query('#cn-assets-next').disabled = activeAssetPage>=pages-1;
    const visible = available.slice(start,start+assetsPerPage);
    const credits = [];
    if (visible.some(asset=>asset.series==='existing' && activeCollection==='wash')) credits.push('AqwaColor');
    if (visible.some(asset=>asset.series==='pretty')) credits.push('Printable Pretty Studio');
    const credit = query('#cn-assets-credit');
    credit.hidden = !credits.length;
    credit.textContent = credits.length ? '元画像の表記：'+credits.join(' / ') : '';
    query('#cn-tape-hint').hidden = activeCollection!=='tape';
    for (const button of root.querySelectorAll('[data-collection]')) {
